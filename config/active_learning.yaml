# Active Learning Configuration
init_train_cfg: data/GAP_tagged/cfg/pot_1016_dimers_le3/train.cfg
init_train_pot: results/potentials/pot_308865/pot.almtp
# Sibling round folder for this AL run's outputs (iter_N/, updated_pot.almtp,
# updated_train.cfg). Without this, AL state would default to <pot's
# folder>/AL, which would nest under AL-1/ since init_train_pot points there.
al_root: results/potentials/pot_308865/AL-1

# Maximum number of active learning iterations
max_iterations: 200

# MD settings (Step A)
lammps_binary: /projappl/project_2012355/CODE/lammps-stable_23Jun2022_update4-EPH/src/lmp_mpi

# Liquid lat_param values derived from ρ(T) = −4.42×10⁻⁴·T + 6.17 g/cm³. a = (8·M / (Nₐ · ρ))^(1/3) × 10⁸ [Å] {https://doi.org/10.1016/S0022-0248(99)00089-5}
