# Active Learning Configuration

# Extrapolation grade threshold: configs with grade > threshold are selected
grade_threshold: 2.0

# Maximum number of active learning iterations
max_iterations: 20

# Candidate pool path (already DFT-labeled configs, generated by --mode pool)
preselected_cfg: data/candidate_pool.cfg

# Auto mode: merge selected configs directly without DFT pause.
# Set to false if you need to label new (unlabelled) candidate structures with DFT.
auto_labeled: true

# Seed set parameters (used by src/convert.py --mode pool)
seed_per_type: 1              # configs per config_type to put in seed set
always_include_types: []      # exact config_type names: all their configs go to seed
always_include_contains:      # substring match: all types whose name contains these go to seed
  - bulk
exclude_types:                # completely skip these types (not in seed, not in pool)
  - dimer
