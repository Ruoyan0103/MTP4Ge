init_train_cfg: /scratch/project_2012355/Paper_3/00-subsets/00-all/seed_locked_select_add.cfg # base training set copied into the dated train file on first AL run
init_test_cfg: /scratch/project_2012355/Paper_3/00-subsets/00-all/seed_locked_select_add.cfg # base test set copied into the dated test file on first AL run
init_train_pot: /scratch/project_2012355/Paper_3/00-subsets/00-all/pot24_locked_select_add.almtp # initial potential for Step A (iteration 1)


# Maximum number of active learning iterations
max_iterations: 200

# MD settings (Step A)
lammps_binary: /projappl/project_2012355/CODE/lammps-stable_23Jun2022_update4-EPH/src/lmp_mpi
lat_param: 5.76                      # default Ge diamond cubic lattice constant (Å); used for solid trajectories without explicit lat_param

# Parallel trajectories for Step A.
# When this key is present, active_learning.py launches all N LAMMPS jobs
# simultaneously (one per entry) and merges their preselected.cfg files into a
# single pool before select_add runs MaxVol selection.
#
# Each entry requires: temperature (K).
# Optional per-entry keys (all templates):
#   lat_param       : Å; if absent, liquid entries derive it from ρ(T), solid
#                     entries fall back to the global lat_param above
#   supercell_size  : integer N; tiles the primitive/cubic cell N×N×N before
#                     passing to LAMMPS (default 1; overrides global supercell_size)
#   template        : 'solid' (default, uses md_nvt.in) or
#                     'liquid' (3-step melt→cool→equil, uses md_nvt_liquid.in)
#   grade_threshold : γ_select for this trajectory (overrides global grade_threshold)
#   grade_break     : γ_break  for this trajectory; set equal to grade_threshold
#                     to collect at most one config per liquid trajectory
#
# Liquid-only keys:
#   coef            : compression/expansion coefficient; lat_param is multiplied
#                     by (1 + coef). e.g. coef: 0.05 → 5% expansion of the box
#   cubic           : true → conventional 8-atom cubic cell; false → FCC primitive
#                     cell (2 atoms, default); overrides global cubic
#
# Solid-only keys:
#   strain          : True/False; when True, AL-selected structures are strained
#                     (30 variants: hydrostatic × uniaxial × shear, ε ±1–5%)
#                     before DFT labeling
#   no_al           : True/False; when True, skip LAMMPS and select_add entirely
#                     — build a diamond cubic cell (8 atoms, or supercell_size^3
#                     × 8 atoms if supercell_size > 1) from the global lat_param
#                     (or per-entry lat_param override), apply 30 strains, and
#                     run DFT; the potential is not consulted
#
# Liquid lat_param values derived from ρ(T) = −4.42×10⁻⁴·T + 6.17 g/cm³. a = (8·M / (Nₐ · ρ))^(1/3) × 10⁸ [Å] {https://doi.org/10.1016/S0022-0248(99)00089-5}
