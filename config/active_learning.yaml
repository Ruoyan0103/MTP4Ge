# Active Learning Configuration
init_train_cfg: data/GAP_tagged/cfg/train-tgap.cfg 
init_train_pot: results/potentials/pot_660277/pot.almtp 

# Maximum number of active learning iterations
max_iterations: 200

# MD settings (Step A)
lammps_binary: /projappl/project_2012355/CODE/lammps-stable_23Jun2022_update4-EPH/src/lmp_mpi

# Liquid lat_param values derived from ρ(T) = −4.42×10⁻⁴·T + 6.17 g/cm³. a = (8·M / (Nₐ · ρ))^(1/3) × 10⁸ [Å] {https://doi.org/10.1016/S0022-0248(99)00089-5}
trajectories:   
  - {lattice_constant: 5.6, temperature: 1600, template: liquid, supercell_size: 4, cubic: false, coef: 0.03, grade_threshold: 2, grade_break: 10}
  - {lattice_constant: 5.6, temperature: 1800, template: liquid, supercell_size: 4, cubic: false, coef: 0.05, grade_threshold: 2, grade_break: 10}
  - {lattice_constant: 5.8, temperature: 1600, template: liquid, supercell_size: 4, cubic: false, coef: 0.03, grade_threshold: 2, grade_break: 10}
  - {lattice_constant: 5.8, temperature: 1800, template: liquid, supercell_size: 4, cubic: false, coef: 0.05, grade_threshold: 2, grade_break: 10}
#  - {template: melt_quench, supercell_size: 3, density: 4.5, quench_rate: 1e13, grade_threshold: 2, grade_break: 10}

# Tagging engine (Steps C/D — single-point reference labeling of AL-selected
# structures): 'vasp' (default) runs DFT via VASP, one run per structure;
# 'gap' runs the TurboGAP GAP potential (turbogap predict) over all selected
# structures in one call. See src/active_learning_structs/active_learning.py
# (run_dft_labeling / run_gap_labeling) and src/tagging_structs/{VASP,GAP}_settings.py.
tagging_engine: gap

max_tagging_per_iter: 0      # max DFT/GAP labeling jobs per iteration (0 = no cap)

# VASP job/cluster settings (tagging_engine: vasp). DFT physics parameters
# (ENCUT, EDIFF, smearing, functional, precision, k-spacing, ...) are fixed
# in src/tagging_structs/VASP_settings.py (set_cal) — the single source of
# truth shared with the structure-generation scripts — not configured here.
vasp_mode: sbatch            # 'sbatch': submit a new SLURM array job; 'inline': run in parallel using current allocation
vasp_command: srun vasp_std  # VASP launch command inside each array task
# SLURM settings for the VASP array job (Steps D/E, used only when vasp_mode=sbatch)
slurm_account: project_2012355
# NOTE: must NOT be 'test' — the AL driver job itself runs on 'test', which has
# a per-user MaxJobs=1 limit; nested jobs submitted here from inside that
# running driver would then permanently deadlock on AssocMaxJobsLimit.
slurm_partition: test
slurm_time_dft: "00:15:00"    # wall time per VASP array task
slurm_ntasks_dft: 32          # MPI tasks per VASP job
slurm_setup_dft: "module load gcc/15.2.0 openmpi/5.0.10 hdf5/1.14.6 netlib-scalapack/2.2.2 fftw/3.3.10 vasp/6.4.3"  # shell commands run before vasp_command
vasp_kpar: 2                        # KPAR   — k-point parallelization (Found 36 irreducible k-points)
vasp_ncore: 8                       # NCORE  — cores per band
vasp_pp_path: /appl/soft/phys/vasp  # parent of potpaw_PBE.64/
vasp_pp_version: "64"               # ASE 3.28+ requires explicit version; selects potpaw_PBE.64/

# GAP job/cluster settings (tagging_engine: gap). turbogap predict runs once
# per iteration over all selected structures (no per-structure array job, so
# there's nothing analogous to vasp_ncore/vasp_kpar to tune here).
turbogap_mode: sbatch          # 'sbatch': submit a new SLURM job (blocks until it finishes); 'inline': run directly using current allocation
turbogap_command: "srun /projappl/project_2012355/CODE/TurboGAP_EPH/bin/turbogap"  # turbogap launch command; 'predict' is appended by the code, not here
# SLURM settings for the turbogap job (used only when turbogap_mode=sbatch; reuses slurm_account/slurm_partition above)
slurm_time_turbogap: "00:15:00"   # wall time for the turbogap job
slurm_ntasks_turbogap: 10          # MPI tasks for the turbogap job
slurm_setup_turbogap: ""           # shell commands (e.g. module loads) run before turbogap_command — fill in for this cluster
