 # Compressed melt-quench (64 atoms, 2x2x2 diamond start), 6.5-8.5 g/cm3 = 0.78-0.59 of diamond V0 (23.91 A^3/atom),
 # filling the gap between normal-density liquid/amorphous data (4.0-5.63 g/cm3) and the compressed crystals above.
 # The density is fixed for the whole run (NVT, md_melt_quench.in): 100 K -> 1900 K -> 1900 K hold -> quench at
 # 1e12 K/s -> 100 K, dt = 0.5 fs, so the samples are high-pressure liquid and glass rather than normal a-Ge.
