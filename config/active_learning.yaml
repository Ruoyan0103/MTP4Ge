# Active Learning Configuration

# Extrapolation grade threshold: configs with grade > threshold are selected
grade_threshold: 2.0

# Maximum number of active learning iterations
max_iterations: 20

# MD settings (Step B)
temperature: 300                    # K — default temperature for AL MD
md_steps: 10000                     # MD steps per iteration
lammps_binary: srun -n 32 lmp_mpi      # LAMMPS launch command (srun for HPC)

# VASP DFT settings (Step D/E — default single-point parameters)
vasp_command: srun -n 32 vasp_std  # VASP launch command (srun for HPC)
vasp_encut: 400                     # plane-wave cutoff (eV)
vasp_ediff: 1.0e-6                  # SCF convergence criterion
vasp_pp_path: /appl/soft/phys/vasp/potpaw_PBE.64   # parent dir for POTCAR files
vasp_setups:                        # pseudopotential variant per element
  Ge: "_d"                          # uses Ge_d/POTCAR (includes d electrons)
