# MTP Training Configuration
# All paths are relative to the repository root.

mlp_binary: /scratch/project_2012355/Paper_3/mlip-3-prune/bin/mlp
mlp_mpi_binary: srun -n 20 /scratch/project_2012355/Paper_3/mlip-3-prune/bin/mlp

mtp_template: results/potentials/pot-2026-06-26.almtp
train_cfg: data/train-2026-06-26.cfg
output_potential: results/potentials/pot-2026-06-26_v2.almtp

# Training hyperparameters
iteration_limit: 2000
tolerance: 1e-3

al_mode: cfg          

# Loss weights (relative importance of energy / force / stress errors)
energy_weight: 1.0
force_weight: 0.01
stress_weight: 0.001

# Weight scaling with atom count (configs of different sizes):
#   weight_scaling=1, weight_scaling_forces=0  → MD trajectories  (use this)
#   weight_scaling=2, weight_scaling_forces=1  → periodic DFT structures
#   weight_scaling=0, weight_scaling_forces=0  → molecules
weight_scaling: 1
weight_scaling_forces: 0

# Randomize initial MTP parameters (true recommended when training from scratch)
init_random: false

log_path: logs/train-2026-06-26.log
 